
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ProScalp - Elite Trading Mentorship</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              gold: {
                400: '#FACC15',
                500: '#EAB308',
                600: '#CA8A04',
                glow: 'rgba(234, 179, 8, 0.5)',
              },
              dark: {
                950: '#020617',
                900: '#0F172A',
                800: '#1E293B',
                700: '#334155',
              }
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              serif: ['Playfair Display', 'serif'],
            },
            boxShadow: {
              'glow': '0 0 20px rgba(234, 179, 8, 0.15)',
              'glow-lg': '0 0 40px rgba(234, 179, 8, 0.2)',
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #020617;
        /* Grid Pattern + Radial Glows */
        background-image: 
          linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
          radial-gradient(circle at 50% 0%, rgba(234, 179, 8, 0.15) 0%, transparent 60%),
          radial-gradient(circle at 80% 100%, rgba(59, 130, 246, 0.12) 0%, transparent 50%);
        background-size: 40px 40px, 40px 40px, cover, cover;
        background-attachment: fixed;
        color: #e2e8f0;
        min-height: 100vh;
      }
      
      .glass-panel {
        background: rgba(15, 23, 42, 0.75);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      }

      .glass-panel-hover {
        transition: all 0.3s ease;
      }
      .glass-panel-hover:hover {
        background: rgba(30, 41, 59, 0.85);
        border-color: rgba(234, 179, 8, 0.3);
        box-shadow: 0 0 25px rgba(234, 179, 8, 0.1);
        transform: translateY(-2px);
      }

      .gold-gradient {
        background: linear-gradient(135deg, #FDE047 0%, #EAB308 50%, #A16207 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-shadow: 0 0 30px rgba(234, 179, 8, 0.3);
      }

      .btn-primary {
        background: linear-gradient(135deg, #EAB308 0%, #CA8A04 100%);
        color: #020617;
        box-shadow: 0 4px 15px rgba(234, 179, 8, 0.3);
        transition: all 0.2s ease;
      }
      .btn-primary:hover {
        transform: translateY(-1px);
        box-shadow: 0 6px 20px rgba(234, 179, 8, 0.4);
        filter: brightness(1.1);
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #020617; 
      }
      ::-webkit-scrollbar-thumb {
        background: #334155; 
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #EAB308; 
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "recharts": "https://esm.sh/recharts@^3.6.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",
    "firebase/auth": "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js",
    "firebase/firestore": "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js",
    "firebase/storage": "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js",
    "firebase/": "https://esm.sh/firebase@^12.7.0/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
